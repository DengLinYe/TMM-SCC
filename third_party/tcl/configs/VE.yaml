train_file: "../../data/snli-ve/ve_train.json"
val_file: "../../data/snli-ve/ve_dev.json"
test_file: "../../data/snli-ve/ve_test_main_1k.json"

image_root: "../../data/flickr30k/flickr30k-images/"

image_res: 384
batch_size_train: 8
batch_size_test: 8

alpha: 0.4
distill: true
warm_up: false

bert_config: "configs/config_bert.json"

optimizer: { opt: adamW, lr: 2e-5, weight_decay: 0.02 }
schedular:
  {
    sched: cosine,
    lr: 2e-5,
    epochs: 3,
    min_lr: 1e-6,
    decay_rate: 1,
    warmup_lr: 1e-5,
    warmup_epochs: 1,
    cooldown_epochs: 0,
  }
